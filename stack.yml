


























































services:

  brechoapi:
    image: ghcr.io/pedrodeandradecf/brecholv:producao
    container_name: brechoapi
    restart: unless-stopped
    depends_on:
      brechoapi-postgres:
        condition: service_healthy
    environment:
      DB_HOST: brechoapi-postgres
      DB_NAME: ${DB_NAME:?defina DB_NAME no env do stack}
      DB_USER: ${DB_USER:?defina DB_USER no env do stack}
      DB_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD no env do stack}
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no env do stack}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?defina CORS_ALLOWED_ORIGINS no env do stack}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:?defina R2_ACCOUNT_ID no env do stack}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:?defina R2_ACCESS_KEY_ID no env do stack}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:?defina R2_SECRET_ACCESS_KEY no env do stack}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME:?defina R2_BUCKET_NAME no env do stack}
      R2_PUBLIC_URL: ${R2_PUBLIC_URL:?defina R2_PUBLIC_URL no env do stack}
    healthcheck:
      
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health/liveness"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s
    networks:
      - interna
      - npm
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  brechoapi-postgres:
    image: postgres:16-alpine
    container_name: brechoapi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:?defina DB_NAME no env do stack}
      POSTGRES_USER: ${DB_USER:?defina DB_USER no env do stack}
      
      POSTGRES_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD no env do stack}
    volumes:
      - brechoapi-postgres-dados:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - interna
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

networks:
  interna: {}
  npm:
    external: true
    name: ${NPM_NETWORK:?defina NPM_NETWORK no env do stack, com o nome da rede Docker do NPM}

volumes:
  brechoapi-postgres-dados:
    
    name: brechoapi-postgres-dados
