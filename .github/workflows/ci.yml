











































name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - README.md
  workflow_dispatch:

permissions: {}

env:
  IMAGEM: ghcr.io/pedrodeandradecf/brecholv
  VIGIA_INTERVALO_MIN: "5"

jobs:
  testes:
    name: Testes
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Testes (./mvnw -B clean test)
        run: |
          chmod +x mvnw
          ./mvnw -B clean test

  imagem:
    name: Imagem (sha-<sha>; producao só na ponta do main)
    needs: testes
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    concurrency:
      group: brecholv-imagem-producao
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Origem (a linha Origem do commit)
        id: origem
        run: |
          origem=$(git log -1 --format=%B "$GITHUB_SHA" | sed -n 's/^Origem: \([0-9a-f]\{40\}\)$/\1/p' | head -n 1)
          if [ -z "$origem" ]; then
            echo "::error::o commit $GITHUB_SHA não tem a linha 'Origem: <sha de 40 hex>'; a label brecho.origem não teria valor"
            exit 1
          fi
          echo "sha=$origem" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Construir e publicar sha-<sha>
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGEM }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            brecho.origem=${{ steps.origem.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Guarda (o commit é a ponta do main?)
        id: ponta
        run: |
          ponta=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ -z "$ponta" ]; then
            echo "::error::não consegui ler a ponta do main; producao NÃO andou"
            exit 1
          fi
          if [ "$ponta" = "$GITHUB_SHA" ]; then
            echo "mover=sim" >> "$GITHUB_OUTPUT"
          else
            echo "mover=nao" >> "$GITHUB_OUTPUT"
            echo "::warning::producao NÃO andou: $GITHUB_SHA não é a ponta do main ($ponta). A imagem sha-$GITHUB_SHA foi publicada."
          fi

      - name: Mover producao para o digest desta execução
        if: steps.ponta.outputs.mover == 'sim'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          docker buildx imagetools create --tag "$IMAGEM:producao" "$IMAGEM@$DIGEST"
          lido=$(docker buildx imagetools inspect "$IMAGEM:producao" --format '{{json .Manifest}}' | jq -r .digest)
          if [ "$lido" != "$DIGEST" ]; then
            echo "::error::producao aponta para $lido, e não para o digest desta execução ($DIGEST)"
            exit 1
          fi

      - name: Aviso no resumo da execução
        if: always()
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          MOVEU: ${{ steps.ponta.outputs.mover }}
          STATUS: ${{ job.status }}
        run: |
          if [ "$MOVEU" = "sim" ] && [ "$STATUS" = "success" ]; then
            echo "**producao** -> \`$DIGEST\`. A VPS busca em até $VIGIA_INTERVALO_MIN min (vigia). \"Feita\" é a D7, não este verde." >> "$GITHUB_STEP_SUMMARY"
          elif [ "$MOVEU" = "sim" ]; then
            echo "**producao INCERTO**: a guarda deixou mover (sha-$GITHUB_SHA: \`$DIGEST\`), mas mover ou reler falhou. Conferir o digest de producao: o vigia sobe o que ela apontar." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "**producao NÃO andou** nesta execução (sha-$GITHUB_SHA: \`${DIGEST:-não publicada}\`). A VPS não vai mudar por causa dela." >> "$GITHUB_STEP_SUMMARY"
          fi
